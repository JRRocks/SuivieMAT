name: Build debug APK

# Produit l'APK de test sans poste Windows (voir CLAUDE.md), et le depose dans le
# dossier release/ de la branche compilee. Depuis le 2026-10-28, c'est la variante
# "optimise" (R8, non debuggable, meme cle de debug) : ~4 fois plus rapide au demarrage
# qu'un APK debuggable, mesures dans consignes/outils.md § 7. Le nom du fichier depose
# (SuivieMAT-debug.apk) et celui du workflow restent inchanges : le lien de la page
# GitHub de l'APK ne bouge pas.
#
# Sur le depot SuivieMAT, le declenchement sur push ne s'est jamais produit (constate le
# 2026-09-24) ; le lancement manuel (workflow_dispatch), lui, fonctionne, y compris sur
# une branche autre que la branche par defaut — depuis l'onglet Actions ou l'API.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/init-xyw7gc
      - claude/remove-scanlist-history-a5bqzh
    # Le commit de l'APK lui-meme ne doit pas relancer une compilation. Le banc de
    # mesure OCR et la verification de la mise a jour non plus : rien de ces dossiers
    # n'entre dans l'APK, et chacun a son propre workflow.
    paths-ignore:
      - 'release/**'
      - 'ocrbench/**'
      - '.github/workflows/ocr-bench.yml'
      - 'verif-maj/**'
      - '.github/workflows/verif-mise-a-jour.yml'

permissions:
  # Ecriture : necessaire au depot de l'APK dans release/.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Seule cette branche publie des releases : l'application installee les propose a
      # son utilisateur (mise a jour integree, decision 34). Une compilation lancee a la
      # main sur une autre branche ne doit pas arriver sur les telephones.
      BRANCHE_DES_RELEASES: claude/remove-scanlist-history-a5bqzh
    steps:
      - uses: actions/checkout@v4

      - name: Configurer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Autoriser l'execution de gradlew
        run: chmod +x gradlew

      # Le SDK est deja present sur le runner, mais sdkmanager n'est pas dans le PATH.
      # On le localise plutot que de passer par android-actions/setup-android, qui
      # tentait d'installer le paquet obsolete "tools" et echouait depuis son retrait
      # du depot SDK (2026-09).
      - name: Installer les paquets SDK necessaires
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager introuvable sous $SDK" >&2
            exit 1
          fi
          echo "sdkmanager : $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.1.0"

      - name: Lancer les tests unitaires
        run: ./gradlew testDebugUnitTest --stacktrace

      # apk.phoneOnly : arm64 seul, l'APK depose est destine au telephone, pas a
      # l'emulateur (voir app/build.gradle.kts).
      - name: Compiler l'APK optimise
        id: apk
        run: ./gradlew assembleOptimise -Papk.phoneOnly --stacktrace

      # Retention d'un jour : le stockage des artefacts est facture a l'heure, sur un
      # quota de 0,5 Go partage par tout le compte (atteint le 2026-10-10).
      - name: Publier le rapport de tests en cas d'echec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: app/build/reports/tests/
          retention-days: 1

      # Dans la branche elle-meme, a la demande de l'utilisateur : sans ordinateur, un
      # fichier de la branche se telecharge depuis le telephone, alors qu'un artefact de
      # run expire (et coute du stockage). Un push fait avec GITHUB_TOKEN ne declenche aucun nouveau
      # run : pas de boucle, en plus du paths-ignore ci-dessus.
      - name: Deposer l'APK dans release/ de la branche
        run: |
          mkdir -p release
          cp app/build/outputs/apk/optimise/app-optimise.apk release/SuivieMAT-debug.apk
          {
            echo "commit source : ${GITHUB_SHA}"
            echo "compile le    : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "sha256        : $(sha256sum release/SuivieMAT-debug.apk | cut -d' ' -f1)"
          } > release/SuivieMAT-debug.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/
          git diff --cached --quiet && exit 0
          git commit -m "Depose l'APK optimise compile par la CI (${GITHUB_SHA::7})"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Mise a jour integree (decision 34) : l'application lit la derniere release du
      # depot et propose son APK. Une release par version, jamais remplacee : deux APK
      # differents sous le meme numero ne se distingueraient plus, et un telephone deja a
      # cette version ne verrait jamais le second. Si la version existe deja, la
      # compilation n'est donc pas publiee, et un avertissement le dit.
      #
      # Tente meme si le depot dans release/ a echoue : les deux canaux sont independants.
      - name: Publier la release GitHub de cette version
        if: ${{ !cancelled() && steps.apk.outcome == 'success' && github.ref_name == env.BRANCHE_DES_RELEASES }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/optimise/app-optimise.apk
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          AAPT2="$(ls "$SDK"/build-tools/*/aapt2 | sort -V | tail -1)"
          # Lue dans l'APK lui-meme, et non dans le fichier de build : c'est cette
          # valeur que le telephone comparera.
          VERSION="$("$AAPT2" dump badging "$APK" | sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p")"
          if [ -z "$VERSION" ]; then
            echo "versionName illisible dans $APK" >&2
            exit 1
          fi
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::warning::La release $TAG existe deja : cette compilation n'est pas publiee. Monter versionCode et versionName dans app/build.gradle.kts pour qu'elle soit proposee aux telephones."
            exit 0
          fi
          # Le nom porte l'architecture : l'application choisit l'APK de son appareil.
          ASSET="SuivieMAT-$VERSION-arm64-v8a.apk"
          cp "$APK" "$ASSET"
          sed -e "s/{{VERSION}}/$VERSION/g" \
              -e "s/{{COMMIT}}/${GITHUB_SHA::7}/g" \
              -e "s/{{SHA256}}/$(sha256sum "$ASSET" | cut -d' ' -f1)/g" \
              .github/release-notes.md > notes-release.md
          gh release create "$TAG" "$ASSET" \
            --target "$GITHUB_SHA" \
            --title "SuivieMAT $VERSION" \
            --notes-file notes-release.md

      # L'APK est deja dans release/ : en artefact, il doublait ~40 Mo par run pendant
      # 7 jours. Il n'est plus publie que si le depot dans la branche a echoue, comme
      # repli. Sans APK (tests en echec), rien a publier, sans erreur.
      - name: Publier l'APK si le depot dans release/ a echoue
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-optimise-apk
          path: app/build/outputs/apk/optimise/app-optimise.apk
          retention-days: 1
          if-no-files-found: ignore

  # Purge les artefacts des runs precedents, quelle que soit l'issue de celui-ci.
  nettoyage:
    needs: build
    if: always()
    uses: ./.github/workflows/nettoyage-actions.yml
    with:
      age_max_heures: 0
    permissions:
      actions: write
