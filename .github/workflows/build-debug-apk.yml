name: Build debug APK

# Sert a produire un APK de debug telechargeable depuis une session cloud,
# qui n'a pas de SDK Android local (voir CLAUDE.md). workflow_dispatch ne
# devient utilisable qu'une fois ce fichier present sur la branche par
# defaut ; le declenchement sur push fonctionne des la premiere branche.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/init-xyw7gc

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Autoriser l'execution de gradlew
        run: chmod +x gradlew

      # Le SDK est deja present sur le runner, mais sdkmanager n'est pas dans le PATH.
      # On le localise plutot que de passer par android-actions/setup-android, qui
      # tentait d'installer le paquet obsolete "tools" et echouait depuis son retrait
      # du depot SDK (2026-09).
      - name: Installer les paquets SDK necessaires
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager introuvable sous $SDK" >&2
            exit 1
          fi
          echo "sdkmanager : $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.1.0"

      - name: Lancer les tests unitaires
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compiler l'APK de debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Publier le rapport de tests en cas d'echec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: app/build/reports/tests/
          retention-days: 7

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
