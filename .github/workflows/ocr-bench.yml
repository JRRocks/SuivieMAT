name: Banc OCR sur emulateur

# Compare les moteurs de lecture OCR sur un emulateur Android : ML Kit (C++, celui de
# l'application), un moteur ecrit en Rust, et le traitement Kotlin de l'application face
# a son portage en Rust. Mode d'emploi et lecture des resultats : ocrbench/README.md.
#
# Ne produit aucun APK et n'ecrit rien dans la branche : il mesure, et depose son rapport
# dans le resume de l'execution.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/remove-scanlist-history-a5bqzh
    paths:
      - 'ocrbench/**'
      - '.github/workflows/ocr-bench.yml'

permissions:
  contents: read

# Une mesure plus recente rend la precedente inutile.
concurrency:
  group: banc-ocr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  banc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configurer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Autoriser l'execution de gradlew
        run: chmod +x gradlew

      # Meme localisation de sdkmanager que dans build-debug-apk.yml.
      - name: Installer les paquets SDK necessaires
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager introuvable sous $SDK" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.1.0"

      # Le Python du runner refuse les installations hors environnement virtuel. La
      # version de Pillow est figee : c'est elle qui dessine les etiquettes.
      - name: Installer Pillow
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "pillow==12.0.0"

      - name: Preparer les images, les modeles et la bibliotheque Rust
        run: PYTHON="$RUNNER_TEMP/venv/bin/python" ocrbench/prepare.sh x86_64

      # Sans demon : rien ne doit tourner a cote de l'emulateur pendant la mesure.
      - name: Compiler l'application et son test instrumente
        run: >
          ./gradlew --no-daemon --init-script ocrbench/bench.init.gradle
          :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      # Sans acceleration materielle, l'emulateur met des dizaines de minutes a demarrer
      # et ses temps ne veulent plus rien dire.
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Lancer le banc sur l'emulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: ocrbench/run-on-device.sh

      - name: Ecrire le rapport dans le resume de l'execution
        if: always()
        run: |
          if [ -s ocrbench/build/results/rapport.md ]; then
            cat ocrbench/build/results/rapport.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Le banc n'a pas produit de rapport." >> "$GITHUB_STEP_SUMMARY"
          fi
