name: Verification de la mise a jour sur emulateur

# Deroule la mise a jour integree de bout en bout sur un emulateur : une « version 0.1 »
# de l'application y decouvre la derniere release GitHub, la telecharge, la fait
# installer par Android, puis la version installee se dit a jour. Mode d'emploi et
# lecture du resultat : verif-maj/README.md.
#
# Ne produit aucun APK et n'ecrit rien dans la branche. Il faut qu'une release existe :
# a lancer apres la compilation qui l'a publiee.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/remove-scanlist-history-a5bqzh
    paths:
      - 'verif-maj/**'
      - '.github/workflows/verif-mise-a-jour.yml'

permissions:
  contents: read

concurrency:
  group: verif-maj-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Configurer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Autoriser l'execution de gradlew
        run: chmod +x gradlew

      # Meme localisation de sdkmanager que dans build-debug-apk.yml.
      - name: Installer les paquets SDK necessaires
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager introuvable sous $SDK" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.1.0"

      # La variante livree aux telephones (R8), pour les deux architectures : l'emulateur
      # est en x86_64. Seul le numero de version est fausse, par le script d'initialisation.
      - name: Compiler l'ancienne version factice
        run: >
          ./gradlew --no-daemon --init-script verif-maj/ancienne-version.init.gradle
          :app:assembleOptimise --stacktrace

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Derouler la mise a jour sur l'emulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 verif-maj/verifier.py app/build/outputs/apk/optimise/app-optimise.apk
