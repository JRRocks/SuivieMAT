// Fait passer l'application pour une tres vieille version, le temps d'une verification :
// installee ainsi, elle voit la derniere release GitHub comme une mise a jour et tout le
// parcours peut etre deroule sur un emulateur. Passe a Gradle par --init-script, sans
// rien ecrire dans le fichier de build du module. Voir README.md.
allprojects {
    if (path == ':app') {
        pluginManager.withPlugin('com.android.application') {
            // Par variante, et non dans defaultConfig : ce bloc s'execute avant le
            // fichier de build du module, qui reecrirait aussitot son propre numero.
            androidComponents {
                onVariants(selector().all()) { variant ->
                    variant.outputs.each { output ->
                        output.versionCode.set(1)
                        output.versionName.set('0.1')
                    }
                }
            }
        }
    }
}
